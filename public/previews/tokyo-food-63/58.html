<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A silent illustrated Tokyo arrival, reusing Sam and the four-gate visual language from 56.html.">
<title>Sam’s Silent Tokyo Arrival</title>
<style>
:root{
  --ink:#3C3C4A;--muted:#8A8A9A;--line:#E5E5EA;--paper:#F7F7F9;--map:#F5F3EE;
  --role:#3BA8FF;--task:#2DC07A;--context:#FF9F1C;--format:#9B6BFF;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{display:grid;place-items:center;overflow:hidden;background:#111827;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#video{position:relative;width:min(100vw,1280px,177.777dvh);height:min(100dvh,720px,56.25vw);aspect-ratio:16/9;overflow:hidden;border:2px solid rgba(255,255,255,.28);border-radius:20px;background:#dce8f2;isolation:isolate}
svg{display:block}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;overflow:hidden}
.airport-base{position:absolute;inset:0}
.airport-base svg{width:100%;height:100%}
#jet-symbols{position:absolute;width:0;height:0;overflow:hidden}
.flight-plane{position:absolute;z-index:3;left:16%;top:40.8%;width:58%;height:auto;transform:translate(-118%,-75%) rotate(-7deg) scale(.74);transform-origin:52% 55%;animation:flight 35.8s linear infinite}
.flight-plane svg{width:100%;height:auto;overflow:visible}
@keyframes flight{
  0%{opacity:0;transform:translate(-118%,-75%) rotate(-7deg) scale(.74)}
  1.5%{opacity:1;transform:translate(-98%,-68%) rotate(-5.8deg) scale(.78)}
  6%{opacity:1;transform:translate(-62%,-47%) rotate(-4.3deg) scale(.86)}
  11.5%{opacity:1;transform:translate(-22%,-22%) rotate(-2.8deg) scale(.94)}
  13%{opacity:1;transform:translate(3%,-10%) rotate(-2.2deg) scale(.97)}
  14.4%{opacity:1;transform:translate(18%,0) rotate(-.3deg) scale(1)}
  14.8%{opacity:1;transform:translate(18%,.8%) rotate(0) scale(.998)}
  15.5%{opacity:1;transform:translate(22%,.8%) rotate(0) scale(1)}
  17.5%{opacity:1;transform:translate(38%,.8%) rotate(0) scale(1)}
  18.2%{opacity:0;transform:translate(38%,.8%) rotate(0) scale(1)}
  20.95%{opacity:0;transform:translate(38%,.8%) rotate(0) scale(1)}
  100%{opacity:0;transform:translate(-118%,-75%) rotate(-7deg) scale(.74)}
}
.gear-drop{transform-box:fill-box;transform-origin:50% 0;opacity:0;animation:gear-deploy 35.8s linear infinite}
@keyframes gear-deploy{
  0%,8.6%{opacity:0;transform:translateY(-12px)}
  11.5%{opacity:1;transform:translateY(0)}
  14.4%{opacity:1;transform:translateY(1px)}
  14.8%{opacity:1;transform:translateY(-1px)}
  18.2%,100%{opacity:0;transform:translateY(-1px)}
}
.wheel{transform-box:fill-box;transform-origin:center;animation:wheel-turn 35.8s linear infinite}
@keyframes wheel-turn{0%,14.1%{transform:rotate(0)}17.5%{transform:rotate(620deg)}100%{transform:rotate(620deg)}}
.tire-puff{position:absolute;z-index:2;left:72%;top:70%;width:12%;height:9%;opacity:0;animation:tire-puff 35.8s ease-out infinite}
.tire-puff path{fill:none;stroke:#f4f7fa;stroke-width:5;stroke-linecap:round}
@keyframes tire-puff{
  0%,14.2%,100%{opacity:0}
  14.9%{opacity:.72}
  15.5%{opacity:.16}
  16.2%{opacity:0}
}
.airport-exit{z-index:4;animation:exit-scene 35.8s linear infinite}
@keyframes exit-scene{
  0%,17.2%{opacity:0}
  17.8%{opacity:1}
  20.95%{opacity:1}
  21.2%,100%{opacity:0}
}
.parked-plane{position:absolute;left:38%;top:41.1%;width:58%;height:auto;opacity:0;animation:parked-plane 35.8s linear infinite}
.parked-plane svg{width:100%;height:auto;overflow:visible}
@keyframes parked-plane{0%,17.5%{opacity:0}18.2%,20.95%{opacity:1}21.2%,100%{opacity:0}}
.exit-door{transform-box:fill-box;transform-origin:left center;animation:door-open 35.8s linear infinite}
@keyframes door-open{
  0%,17.5%{transform:rotate(0)}
  18.2%,20.95%{transform:rotate(68deg)}
  21.2%,100%{transform:rotate(0)}
}
.stairs{position:absolute;z-index:3;left:63.5%;top:51%;width:20%;height:25%;opacity:0;animation:stairs-down 35.8s linear infinite}
.stairs svg{width:100%;height:100%;overflow:visible}
@keyframes stairs-down{
  0%,17.5%{opacity:0;transform:translateY(-8px)}
  18.5%,20.95%{opacity:1;transform:none}
  21.2%,100%{opacity:0}
}
.traveler{position:absolute;z-index:6;display:flex;align-items:flex-end;gap:1%;width:13%;height:36%;opacity:0;overflow:visible}
.traveler svg{overflow:visible}
.person{height:100%;width:auto;flex:none}
.person .leg,.person .arm,.person .torso,.person .head{transform-box:fill-box}
.person .leg{transform-origin:50% 0}
.person .arm{transform-origin:50% 0}
.person .torso{transform-origin:50% 95%}
.person .head{transform-origin:50% 96%}
.walking .leg-left{animation:step-left .62s ease-in-out infinite}
.walking .leg-right{animation:step-right .62s ease-in-out infinite}
.walking .arm-left{animation:arm-left .62s ease-in-out infinite}
.walking .arm-right{animation:arm-right .62s ease-in-out infinite}
.walking .torso{animation:body-step .62s ease-in-out infinite}
.walking .head{animation:head-step .92s ease-in-out infinite}
@keyframes step-left{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-9deg)}}
@keyframes step-right{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes arm-left{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes arm-right{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-8deg)}}
@keyframes body-step{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes head-step{0%,100%{transform:rotate(1deg)}50%{transform:rotate(-1deg)}}
.airport-traveler{left:81%;top:40%;animation:exit-walk 35.8s cubic-bezier(.33,0,.35,1) infinite}
@keyframes exit-walk{
  0%,18%{opacity:0;left:81%;top:39%}
  18.5%{opacity:1;left:80%;top:40%}
  19.1%{opacity:1;left:77%;top:48%}
  19.7%{opacity:1;left:73%;top:56%}
  20.4%{opacity:1;left:69%;top:59%}
  20.95%{opacity:1;left:67%;top:59%}
  21.2%,100%{opacity:0;left:67%;top:59%}
}
.suitcase{position:absolute;right:-5%;bottom:4%;height:37%;width:auto}
.wheel-small{transform-box:fill-box;transform-origin:center;animation:bag-wheel .48s linear infinite}
@keyframes bag-wheel{to{transform:rotate(360deg)}}
.hungry .face-neutral{display:none}
.hungry .face-hungry{display:inline}
.puzzled .face-neutral{display:none}
.puzzled .face-puzzled{display:inline}
.face-hungry,.face-puzzled{display:none}
.stomach-cue{opacity:0;animation:stomach-cue 35.8s linear infinite}
.stomach-cue circle{fill:none;stroke:#FF9F1C;stroke-width:2.5}
@keyframes stomach-cue{
  0%,18.4%{opacity:0}
  18.8%{opacity:.8}
  19.2%{opacity:.35}
  19.6%{opacity:.8}
  20%{opacity:.35}
  20.4%{opacity:.8}
  20.95%,21.2%{opacity:0}
  23%{opacity:0}
  25%{opacity:.8}
  27%{opacity:.42}
  29%{opacity:.8}
  31%{opacity:.42}
  33%{opacity:.8}
  36%{opacity:.35}
  39.25%,40.8%{opacity:0}
  42.5%{opacity:.8}
  44%{opacity:.35}
  45.5%{opacity:.8}
  47%{opacity:.35}
  48.5%{opacity:.8}
  50%{opacity:.35}
  52%{opacity:.8}
  55%{opacity:.35}
  57.5%{opacity:0}
  60%{opacity:.8}
  62%{opacity:.42}
  64%{opacity:.8}
  66%{opacity:.42}
  68%{opacity:.8}
  72%{opacity:.35}
  78.8%{opacity:0}
  88%{opacity:0}
  90%{opacity:.8}
  92%{opacity:.35}
  94%{opacity:.8}
  96%{opacity:.35}
  100%{opacity:0}
}
.gates-ui{z-index:5;background:#F7F7F9;animation:gates-scene 35.8s linear infinite}
@keyframes gates-scene{
  0%,20.5%{opacity:0}
  21.4%{opacity:1}
  78.8%{opacity:1}
  79.8%,100%{opacity:0}
}
.app-card{position:absolute;inset:6% 4%;background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:1.5%}
.app-head{height:15%;display:flex;align-items:center;gap:1.5%;border-bottom:2px solid #F0F0F5;padding:0 1.2% 1.2%}
.app-mark{width:7%;height:86%;min-width:40px;display:grid;place-items:center;border-radius:13px;background:#DDF7EA;flex:none}
.app-mark svg{width:76%;height:76%}
.brand-lines{display:flex;flex-direction:column;gap:7px;width:15%}
.brand-lines i,.line i{height:7px;border-radius:99px;background:#E5E5EA;display:block}
.brand-lines i:first-child{width:86%}
.brand-lines i:last-child{width:59%;height:5px;background:#F0F0F5}
.gate-row{margin-left:auto;display:flex;align-items:center;gap:1.5%;height:100%;width:44%;justify-content:flex-end}
.gate-icon{width:18%;max-width:62px;aspect-ratio:1;border-radius:50%;border:2px solid var(--gate);background:#fff;color:var(--gate);display:grid;place-items:center;opacity:.28;transform:translateY(7px);animation-duration:35.8s;animation-timing-function:cubic-bezier(.33,0,.35,1);animation-iteration-count:infinite}
.gate-icon svg{width:47%;height:47%}
.gate-role{--gate:var(--role);animation-name:role-gate}
.gate-task{--gate:var(--task);animation-name:task-gate}
.gate-context{--gate:var(--context);animation-name:context-gate}
.gate-format{--gate:var(--format);animation-name:format-gate}
@keyframes role-gate{
  0%,21%{opacity:.25;transform:translateY(7px);background:#fff}
  22.3%{opacity:1;transform:none;background:#E1F1FF}
  78.8%,100%{opacity:1;transform:none;background:#E1F1FF}
}
@keyframes task-gate{
  0%,24.8%{opacity:.25;transform:translateY(7px);background:#fff}
  26.1%{opacity:1;transform:none;background:#DDF7EA}
  78.8%,100%{opacity:1;transform:none;background:#DDF7EA}
}
@keyframes context-gate{
  0%,28.6%{opacity:.25;transform:translateY(7px);background:#fff}
  29.9%{opacity:1;transform:none;background:#FFF1DA}
  78.8%,100%{opacity:1;transform:none;background:#FFF1DA}
}
@keyframes format-gate{
  0%,32.4%{opacity:.25;transform:translateY(7px);background:#fff}
  33.7%{opacity:1;transform:none;background:#F0E8FF}
  78.8%,100%{opacity:1;transform:none;background:#F0E8FF}
}
.app-body{position:absolute;left:2%;right:2%;top:18%;bottom:2%;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.78fr);gap:2%;min-height:0}
.map-card,.chat-card{position:relative;overflow:hidden;border:2px solid var(--line);border-radius:14px;background:#fff}
.map-card{background:var(--map)}
.map-art{position:absolute;inset:0;width:100%;height:100%}
.map-art .route-white{fill:none;stroke:#fff;stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.map-art .route-green{fill:none;stroke:var(--task);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:map-route 35.8s ease-in-out infinite}
@keyframes map-route{
  0%,41%{stroke-dashoffset:1}
  44%{stroke-dashoffset:.82}
  52%{stroke-dashoffset:0}
  78.8%,100%{stroke-dashoffset:0}
}
.food-pin{opacity:0;transform-box:fill-box;transform-origin:center;animation-duration:35.8s;animation-timing-function:cubic-bezier(.33,0,.35,1);animation-iteration-count:infinite}
.pin-one{animation-name:pin-one}
.pin-two{animation-name:pin-two}
.pin-three{animation-name:pin-three}
@keyframes pin-one{
  0%,41.5%{opacity:0;transform:translateY(-12px)}
  43%{opacity:1;transform:none}
  78.8%,100%{opacity:1;transform:none}
}
@keyframes pin-two{
  0%,44%{opacity:0;transform:translateY(-9px)}
  45.5%{opacity:.8;transform:none}
  78.8%,100%{opacity:.8;transform:none}
}
@keyframes pin-three{
  0%,46.5%{opacity:0;transform:translateY(-8px)}
  48%{opacity:.8;transform:none}
  78.8%,100%{opacity:.8;transform:none}
}
.map-traveler{left:10%;top:60%;width:8%;height:14%;z-index:4;opacity:0;animation:map-walk 35.8s cubic-bezier(.33,0,.35,1) infinite}
@keyframes map-walk{
  0%,39.5%{opacity:0;left:8%;top:67%}
  40.5%,57.5%{opacity:1;left:8%;top:67%}
  59%{opacity:1;left:8%;top:67%}
  68%{opacity:1;left:27%;top:53%}
  75%{opacity:1;left:47%;top:40%}
  78.8%{opacity:1;left:69%;top:25%}
  79.8%,100%{opacity:0;left:69%;top:25%}
}
.chat-card{padding:1.5%;display:flex;flex-direction:column;gap:2%;background:#fff}
.chat-head{display:flex;align-items:center;gap:3%;min-height:18%;padding-bottom:2%;border-bottom:2px solid #F0F0F5}
.robot-avatar{width:16%;max-width:54px;aspect-ratio:1;border-radius:50%;background:#E1F1FF;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.robot-avatar svg{width:79%;height:79%}
.chat-head-lines{display:flex;flex-direction:column;gap:6px;width:62%}
.chat-head-lines i{height:7px;border-radius:99px;background:#E5E5EA}
.chat-head-lines i:last-child{width:62%;height:5px;background:#F0F0F5}
.message-list{display:flex;flex-direction:column;gap:7%;padding-top:3%;flex:1}
.bubble{position:relative;height:15%;min-height:26px;border:2px solid var(--line);border-radius:13px;background:#F7F7F9;opacity:.42;overflow:hidden;animation-duration:35.8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.bubble:before,.bubble:after{content:"";position:absolute;left:10%;height:5px;border-radius:99px;background:#D4DAE2}
.bubble:before{top:30%;width:62%}
.bubble:after{top:57%;width:42%}
.bubble.user{align-self:flex-end;width:76%;background:#3C3C4A;border-color:#3C3C4A;border-radius:13px 13px 4px 13px}
.bubble.user:before,.bubble.user:after{background:rgba(255,255,255,.72)}
.bubble.role{animation-name:msg-role}
.bubble.task{animation-name:msg-task}
.bubble.context{animation-name:msg-context}
.bubble.format{animation-name:msg-format}
.bubble.answer{animation-name:msg-answer;align-self:flex-start;width:92%;background:#fff}
@keyframes msg-role{0%,22%{opacity:.25;border-color:var(--line)}24%{opacity:1;border-color:var(--role)}78.8%,100%{opacity:1;border-color:var(--role)}}
@keyframes msg-task{0%,24%{opacity:.25;border-color:var(--line)}26%{opacity:1;border-color:var(--task)}78.8%,100%{opacity:1;border-color:var(--task)}}
@keyframes msg-context{0%,26%{opacity:.25;border-color:var(--line)}28%{opacity:1;border-color:var(--context)}78.8%,100%{opacity:1;border-color:var(--context)}}
@keyframes msg-format{0%,28%{opacity:.25;border-color:var(--line)}30%{opacity:1;border-color:var(--format)}78.8%,100%{opacity:1;border-color:var(--format)}}
@keyframes msg-answer{0%,64%{opacity:.25;border-color:var(--line)}67%{opacity:1;border-color:var(--task)}78.8%,100%{opacity:1;border-color:var(--task)}}
.chat-gates{display:flex;justify-content:center;gap:3%;padding:2%;border:2px solid var(--line);border-radius:12px;background:#F7F7F9;opacity:0;animation:gate-summary 35.8s ease-in-out infinite}
.chat-gates i{width:12px;height:12px;border-radius:50%;background:var(--gate)}
.chat-gates i:nth-child(1){--gate:var(--role)}
.chat-gates i:nth-child(2){--gate:var(--task)}
.chat-gates i:nth-child(3){--gate:var(--context)}
.chat-gates i:nth-child(4){--gate:var(--format)}
@keyframes gate-summary{0%,57%{opacity:0;transform:translateY(6px)}61%{opacity:1;transform:none}78.8%,100%{opacity:1;transform:none}}
.alley-scene{z-index:7;background:#191E2B;animation:alley-scene 35.8s linear infinite}
@keyframes alley-scene{
  0%,78.8%{opacity:0}
  80%{opacity:1}
  98.3%{opacity:1}
  100%{opacity:0}
}
.alley-art{position:absolute;inset:0;width:100%;height:100%}
.lantern{transform-box:fill-box;transform-origin:50% 0;animation:lantern-sway 4s ease-in-out infinite alternate}
.lantern:nth-child(2){animation-delay:-1.4s}
.lantern:nth-child(3){animation-delay:-2.2s}
@keyframes lantern-sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
.steam{fill:none;stroke:#F6E9D2;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:steam-rise 2.4s ease-in-out infinite}
.steam.two{animation-delay:-.8s}
.steam.three{animation-delay:-1.6s}
@keyframes steam-rise{
  0%{opacity:0;stroke-dashoffset:1;transform:translateY(10px)}
  35%{opacity:.7;stroke-dashoffset:.45}
  100%{opacity:0;stroke-dashoffset:0;transform:translateY(-14px)}
}
.alley-traveler{left:18%;top:44%;width:15%;height:43%;opacity:0;z-index:8;animation:alley-arrive 35.8s cubic-bezier(.33,0,.35,1) infinite}
@keyframes alley-arrive{
  0%,79.3%{opacity:0;left:17%;top:46%}
  81%{opacity:1;left:20%;top:43%}
  87%{opacity:1;left:34%;top:43%}
  92%{opacity:1;left:38%;top:43%}
  98.3%{opacity:1;left:38%;top:43%}
  100%{opacity:0;left:38%;top:43%}
}
.phone-arm{transform-box:fill-box;transform-origin:50% 0;animation:phone-lift 35.8s cubic-bezier(.33,0,.35,1) infinite}
.alley-traveler .arm-right{transform-origin:50% 0;animation:phone-lift 35.8s cubic-bezier(.33,0,.35,1) infinite}
.phone-art{position:absolute;right:-10%;top:8%;width:42%;height:auto;opacity:0;transform:translateY(8px) rotate(0);transform-origin:bottom left;animation:phone-appear 35.8s cubic-bezier(.33,0,.35,1) infinite}
@keyframes phone-appear{
  0%,88%{opacity:0;transform:translateY(8px) rotate(0)}
  91%{opacity:1;transform:translateY(-8px) rotate(-22deg)}
  98.3%{opacity:1;transform:translateY(-8px) rotate(-22deg)}
  100%{opacity:0;transform:translateY(8px) rotate(0)}
}
@keyframes phone-lift{
  0%,86%{transform:rotate(0)}
  91%{transform:rotate(-37deg)}
  98.3%{transform:rotate(-37deg)}
  100%{transform:rotate(0)}
}
.menu-focus{opacity:0;animation:focus-menu 35.8s ease-in-out infinite}
@keyframes focus-menu{
  0%,89%{opacity:0}
  92%{opacity:.75}
  98.3%{opacity:.75}
  100%{opacity:0}
}
@media(prefers-reduced-motion:reduce){
  /* Keep the silent story moving through its scenes. Reduce travel and remove
     looping secondary motion instead of freezing the final alley frame. */
  .flight-plane{animation-name:flight-reduced}
  @keyframes flight-reduced{
    0%{opacity:0;transform:translate(-42%,-22%) rotate(-3deg) scale(.88)}
    1.5%{opacity:1;transform:translate(-38%,-18%) rotate(-2.6deg) scale(.9)}
    6%{opacity:1;transform:translate(-23%,-11%) rotate(-1.8deg) scale(.94)}
    11.5%{opacity:1;transform:translate(-7%,-3%) rotate(-.8deg) scale(.98)}
    14.4%{opacity:1;transform:translate(8%,0) rotate(0) scale(1)}
    14.8%,17.5%{opacity:1;transform:translate(11%,.5%) rotate(0) scale(1)}
    18.2%,20.95%{opacity:0;transform:translate(11%,.5%) rotate(0) scale(1)}
    100%{opacity:0;transform:translate(-42%,-22%) rotate(-3deg) scale(.88)}
  }
  .gear-drop,.wheel,.wheel-small,.exit-door,.lantern,.steam,
  .walking .leg-left,.walking .leg-right,.walking .arm-left,.walking .arm-right,
  .walking .torso,.walking .head{animation:none!important}
  .gear-drop,.stairs,.gate-icon,.food-pin,.chat-gates,.alley-traveler,.phone-art{
    transform:none!important
  }
  .stairs{transform:translateY(0)!important}
  .airport-traveler{left:67%!important;top:59%!important}
  .map-art .route-green{animation:none!important;stroke-dashoffset:0}
  .map-traveler{left:69%!important;top:25%!important}
  .alley-traveler{left:38%!important;top:43%!important}
  .alley-traveler .arm-right{animation:none!important;transform:rotate(-37deg)!important}
  .alley-traveler .phone-art{transform:translateY(-8px) rotate(-22deg)!important}
  .steam{stroke-dasharray:none;stroke-dashoffset:0;opacity:.5}
}
</style>
</head>
<body>
<main id="video" role="img" aria-label="Silent Tokyo arrival: plane landing, Sam searching for food">
<svg id="jet-symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="jet-body" viewBox="0 0 1100 420">
    <path d="M189 170 125 60 231 58 319 168Z" fill="#2DC07A" stroke="#3C3C4A" stroke-width="6" stroke-linejoin="round"/>
    <path d="M207 210 149 309 268 298 326 229Z" fill="#1F9A5E" stroke="#3C3C4A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M412 171 612 28 704 37 559 190Z" fill="#dce4ea" stroke="#5A5A6A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M459 215 633 398 737 391 602 220Z" fill="#cfd9e1" stroke="#5A5A6A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M489 218 638 379 693 377 578 220Z" fill="#2DC07A" opacity=".88"/>
