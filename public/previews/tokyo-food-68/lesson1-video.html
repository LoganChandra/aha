<style>
:root{--ink:#3C3C4A;--muted:#8A8A9A;--line:#E5E5EA;--bg:#F7F7F9;--brand:#2DC07A;

.zc{position:absolute;left:14px;bottom:12px;font-size:12px;font-weight:800;color:var(--ink);background:#F7F7F9;border-radius:99px;padding:2px 8px;box-shadow:inset 0 0 0 2px var(--cur,#8A8A9A);font-variant-numeric:tabular-nums;pointer-events:none}
.zb{position:absolute;right:6px;width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;color:var(--ink);box-shadow:0 4px 10px -6px rgba(20,33,61,.5)}
.gd{position:absolute;left:4px;top:4px;width:68px;height:72px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer}.gd:focus-visible{outline:3px solid var(--ink);outline-offset:1px;border-radius:12px}
.gd svg{width:34px;height:42px;overflow:visible}
.gd .mc{display:none;width:68px;height:72px;aspect-ratio:auto;filter:drop-shadow(0 3px 3px rgba(20,33,61,.3))}.gd .robot-figure{display:none}.gd[data-r=robot] .persona-figure{display:none}.gd[data-r=robot] .robot-figure{display:inline}
.gd.on .mc{display:block}.gd.on .ph{display:none}
.gd .body{fill:#fff;stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:3 2.4;transition:fill .3s,stroke .3s}
.gd .ic{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-linecap:round;transition:stroke .3s}
.gd .hd{fill:#94a3b8;transition:fill .3s}
.gd.on .body{fill:var(--p,#3BA8FF);stroke:#fff;stroke-width:1.6;stroke-dasharray:none;filter:drop-shadow(0 3px 3px rgba(20,33,61,.3))}
.gd.on .ic{stroke:#fff}.gd.on .hd{fill:#fff}
.gd.drop .mc{animation:mcin .55s cubic-bezier(.34,1.56,.64,1)}
.gd.cheer .mc{animation:mcwin .9s ease-out}
@keyframes mcin{from{transform:translateY(26px) scale(.6) rotate(-10deg);opacity:0}60%{transform:translateY(-4px) scale(1.06) rotate(3deg);opacity:1}to{transform:none;opacity:1}}
@keyframes mcwin{30%{transform:translateY(-6px) scale(1.07) rotate(-2deg)}70%{transform:translateY(-2px) scale(1.04) rotate(2deg)}}
.zb.in{top:6px}.zb.out{bottom:6px}
.zb svg{width:20px;height:20px}
.zb:active{transform:scale(.94)}
.zb[aria-disabled=true]{opacity:.35;cursor:default;box-shadow:none}
.drop{animation:drop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:translateY(-9px);opacity:0}to{transform:none;opacity:1}}
.grid{display:flex;flex-direction:column;gap:14px}
.left,.right{display:flex;flex-direction:column;gap:14px;min-width:0}
.chat{position:relative;padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chead span:first-child{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tag{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;color:var(--ink);background:#F7F7F9;box-shadow:inset 0 0 0 2px var(--cur,#8A8A9A)}
.who{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.who.me{text-align:right}
.bub{box-sizing:border-box;font-size:14px;line-height:1.65;font-weight:600}
.you{align-self:flex-end;max-width:94%;background:var(--ink);color:#fff;border-radius:16px 16px 4px 16px;padding:8px 12px}
.ai{background:#fff;border:2px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:15px;line-height:1.5;font-weight:700}
.msgs{flex:1;display:flex;flex-direction:column;gap:6px;transition:opacity .3s}
.jump{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);min-height:44px;padding:0 18px 0 16px;border-radius:99px;background:var(--ink);color:#fff;font-size:14px;font-weight:800;display:none;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(15,23,42,.28);z-index:20}

@media (max-width:899px){body{padding-bottom:76px}}
@media (min-width:900px){.jump{display:none!important}}
mark{color:inherit;border-radius:4px;padding:0 2px;border-bottom:2px solid var(--k);background:var(--kt)}

.mt{--k:#2DC07A;--kt:#e3f6ec;--kp:rgba(45,192,122,.45)}

.mf{--k:#9B6BFF;--kt:#f5e9ff;--kp:rgba(155,107,255,.55)}
.key{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;font-weight:800;color:var(--muted)}
.key .kh{color:var(--ink)}

.gates{display:flex;justify-content:space-between;gap:10px}
.gw{flex:1;max-width:84px;display:flex;flex-direction:column;align-items:center;gap:6px}
.gw .gate{width:100%;max-width:none;flex:none}
.lab{font-size:13px;font-weight:800;color:var(--ink)}
.cap{min-height:52px;margin:0;text-align:center;font-size:16px;line-height:1.35;font-weight:800;color:var(--ink)}
.rc{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;margin:0 2px;padding:2px 8px 2px 5px;border-radius:999px;border:2px solid var(--c);background:#fff;font-size:14px;line-height:1.2;white-space:nowrap}
.rc svg{width:17px;height:17px;flex:none}
.cap b{color:var(--ink);box-shadow:inset 0 -.4em 0 color-mix(in srgb,var(--cur,#8A8A9A) 35%,transparent)}
.unit{font-size:13px;font-weight:700;color:var(--muted);margin-top:2px}
.gate{aspect-ratio:1;border-radius:50%;border:3px solid var(--g);color:var(--g);background:#fff;display:grid;place-items:center;transition:background .3s,color .3s,transform .15s,box-shadow .3s}
.gate svg{width:34%;height:34%}
.gate:active{transform:scale(.93)}
.gate.on{background:var(--g);color:#fff;box-shadow:0 8px 18px -8px var(--g)}
.g1{--g:var(--r)}.g2{--g:var(--t)}.g3{--g:var(--c)}.g4{--g:var(--f)}
.note{margin:auto 0 0;text-align:center;font-size:11px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.win{transform-origin:50px 50px;animation:ping .9s ease-out}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
i{font-style:normal}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 10px 0 8px;border-radius:99px;border:2px solid var(--line);background:#fff;color:var(--muted);font-size:12.5px;font-weight:800;transition:background .25s,border-color .25s,color .25s,transform .15s}
.chip svg{width:16px;height:16px;flex:none}
.chip:active{transform:scale(.95)}
.chips[data-s="3"] .chip{border:2px dashed var(--c);color:var(--ink)}
.chips[data-s="3"] .chip[aria-checked=true]{background:var(--c);border-style:solid}
.chips[data-s="4"] .chip[aria-checked=true]{background:#fff3d6;border:2px solid var(--c);color:var(--ink)}
.chip.pulse,.chips.hint .chip{animation:cpulse .8s ease-out}
.chips.hint .chip{animation-iteration-count:2}
@keyframes cpulse{from{box-shadow:0 0 0 0 rgba(255,159,28,.75)}to{box-shadow:0 0 0 12px rgba(255,159,28,0)}}
.w,mark.mw{animation:wi .38s ease-out both;animation-delay:calc(.55s + var(--i)*80ms)}
@keyframes wi{from{opacity:0}}
@media (prefers-reduced-motion:reduce){main *{transition:none!important;animation:none!important}}

/* chat-app look (Han, 2026-11-13: make it feel like a real chat) */
.chat{padding:0;gap:0;overflow:hidden;background:#fff}
.chead{padding:12px 16px;border-bottom:2px solid var(--line)}

.composer{margin:4px 16px 16px;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 6px 0 18px;border-radius:99px;border:2px solid var(--line);background:#fff;color:#94a3b8;font-size:15px;font-weight:600;user-select:none}

.mc .pt,.mc .pc,.mc .pf,.mc .pk{opacity:0;transform:scale(.85);transform-box:fill-box;transform-origin:center;transition:opacity .3s,transform .3s}
.gd.s2 .pt,.gd.s3 .pc,.gd.s4 .pf,.gd.s4 .pk{opacity:1;transform:none}
.say{position:absolute;left:74px;top:14px;max-width:calc(100% - 74px - 58px);padding:4px 11px;border-radius:99px;background:#fff;border:2px solid var(--sayc,var(--cur,#3BA8FF));font-size:12px;line-height:1.3;font-weight:800;color:var(--ink);box-shadow:0 6px 14px -8px rgba(20,33,61,.5);pointer-events:none;opacity:0;transform:scale(.85);transform-origin:left center;transition:opacity .25s,transform .25s}

/* Lesson progress bar: the plane tracks map interaction progress. */
body{padding-top:calc(52px + env(safe-area-inset-top))}
main{min-height:calc(100dvh - 52px - env(safe-area-inset-top))}
#jb{position:fixed;left:0;right:0;top:0;z-index:60;background:#fff;padding-top:env(safe-area-inset-top)}

.chip{box-shadow:0 3px 0 #cbd5e1}

.gate{box-shadow:0 3px 0 rgba(20,33,61,.16)}

/* ProfAI design system (DESIGN.md): Nunito, emerald brand, 2px borders, 4px lips, flat */
:root{--em:#2DC07A;--em-d:#1F9A5E;--em-l:#DDF7EA;--sk:#3BA8FF;--sk-d:#1C82D6;--sk-l:#E1F1FF;--or:#FF9F1C;--or-d:#D97F00;--or-l:#FFF1DA;--vi:#9B6BFF;--vi-d:#7A4BE0;--vi-l:#F0E8FF;--rd:#FF5A5F;--rd-d:#D93C42;--rd-l:#FFE3E4;--line-d:#CFCFD8}
html,body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;background:#F7F7F9}
h1,h2,h3,button,.lab,.gate{font-family:Nunito,system-ui,sans-serif;font-weight:900}

.card,.chat{border:2px solid #E5E5EA;border-radius:16px;box-shadow:0 4px 0 #E5E5EA}

button:focus-visible{outline:3px solid var(--sk);outline-offset:2px}
.gate{box-shadow:0 4px 0 rgba(0,0,0,.18)}

.chead{flex-wrap:wrap}

/* 38 v2 (Han, 2026-11-14): guide character like his reference (orange cap, flashlight beam, bubble); gate icon is itself the dropdown button */

.gd{--h1:#D97F00;--h2:#FF9F1C;--h3:#FFF1DA}
.say{left:100px;top:auto;bottom:44px;max-width:calc(100% - 100px - 62px);border-radius:14px;border-width:2px;padding:6px 11px;font-size:13px}

.cur{display:block;max-width:76px;margin:-8px auto 0;font:700 12px/1.2 Nunito,system-ui,sans-serif;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 38 v3 (Han, 2026-11-14): dropdown like his reference: rounded card, small caps header, icon + title + one line, tinted selected row, check on the right */
.pop{border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line-d,#CFCFD8),0 18px 30px -18px rgba(60,60,74,.35);padding:4px 8px 8px;top:calc(100% + 8px)}

.pph{min-height:44px;padding:0 0 0 6px;border-bottom:2px solid var(--line);margin-bottom:6px}
.pph span{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pph span:before{display:none}
.done{background:var(--em,#2DC07A);box-shadow:0 3px 0 #1F9A5E;border-radius:12px;min-height:40px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;font-weight:900}
.done:active{transform:translateY(2px);box-shadow:0 1px 0 #1F9A5E}
.opt{gap:12px;min-height:60px;padding:8px 10px;border-radius:14px;border:2px solid transparent}
.opt:has(input:checked){background:color-mix(in srgb,var(--pg) 14%,#fff);border-color:color-mix(in srgb,var(--pg) 35%,#fff)}
.opt:has(input:focus-visible){outline:3px solid var(--pg);outline-offset:1px}
.oi{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--pg) 16%,#fff);color:var(--pg)}

.ck{width:24px;height:24px;flex:none;color:var(--pg);opacity:0;transition:opacity .15s}
.ck svg{width:100%;height:100%}
.opt input:checked~.ck{opacity:1}
.bx{display:none}

/* 38 v3b (Han): distinct icons, empty ring on unpicked rows so a pick is obvious, Done clear of the divider */
.pph{padding:6px 0 10px 6px;min-height:56px}

.oi svg{width:22px;height:22px}

.opt input:checked~.ck{background:var(--pg);border-color:var(--pg)}
.opt input:checked~.ck svg{opacity:1}
.menu-mark{display:none}
.pop.gate-menu{width:min(400px,44vw);right:auto;left:var(--pl,0);border:2px solid #E2E5EC;border-radius:22px;box-shadow:0 14px 32px rgba(26,35,60,.16);padding:8px 10px 12px}

.pop.gate-menu .done:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--pg) 74%,#111)}
.pop.gate-menu .opt{min-height:60px;padding:6px 10px;gap:10px;border:0;border-radius:32px}
.pop.gate-menu .opt:has(input:checked){background:color-mix(in srgb,var(--pg) 13%,#fff);border:0}
.pop.gate-menu .oi{width:28px;height:28px;background:none;border-radius:0;color:var(--pg)}
.pop.gate-menu .oi svg{width:22px;height:22px}

// TOKYO_FOOD_67_MEAL_STORY_JS_START
async function playRestaurantPayoff(){
 if(!actor||!playing||demoCancelled||acted)return false;
 var stage=document.querySelector('.stage'),chat=document.querySelector('.chat'),target=document.getElementById('taskPin');
 if(window.innerWidth<900&&stage){stage.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});await nap(reduce?0:700);}
 if(target){if(!await moveActorTo(target))return false;await nap(reduce?0:750);}
 var scene=document.getElementById('meal-story'),frame=document.getElementById('meal-frame'),bounds=frame.getBoundingClientRect();
 var arm=actor.querySelector('#meal-arm'),upper=actor.querySelector('#meal-arm-upper'),food=actor.querySelector('#meal-food');
 if(!arm||!upper||!food)return false;
 scene.dataset.complete='false';
 actor.classList.add('eating');
 setActorPosition(bounds.left-100,bounds.top+405);
 scene.classList.add('on');
 await nap(reduce?0:100);
 setActorPosition(bounds.left+135,bounds.top+405);
 await nap(reduce?0:1350);
 arm.classList.add('at-mouth');upper.classList.add('at-mouth');
 await nap(reduce?0:860);
 if(!playing||demoCancelled||acted){scene.classList.remove('on','bite');actor.classList.remove('eating','bite');arm.classList.remove('at-mouth');upper.classList.remove('at-mouth');return false;}
 scene.classList.add('bite');actor.classList.add('bite');
 await nap(reduce?0:420);
 food.classList.add('eaten');
 await nap(reduce?0:720);
 arm.classList.remove('at-mouth');upper.classList.remove('at-mouth');
 await nap(reduce?0:760);
 scene.classList.remove('bite');actor.classList.remove('bite');
 if(demoCancelled||acted){scene.classList.remove('on');actor.classList.remove('eating');return false;}
 await nap(reduce?0:900);
 scene.classList.remove('on');
 await nap(reduce?0:600);
 actor.classList.remove('eating','bite');
 scene.dataset.complete='true';
 document.documentElement.dataset.promptStoryComplete='true';
 window.dispatchEvent(new Event('promptstorycomplete'));
 if(window.innerWidth<900&&chat){chat.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});await nap(reduce?0:700);}
 return true;
}
// TOKYO_FOOD_67_MEAL_STORY_JS_END
async function tapNode(node){
 if(!playing||demoCancelled)return false;
 node.classList.add('prompt-target','tapping');actor.classList.add('press');
 await nap(reduce?0:150);
 if(!playing||demoCancelled)return false;
 syntheticAction=true;
 try{node.click();}finally{syntheticAction=false;}
 actor.classList.remove('press');
 await nap(reduce?80:240);
 node.classList.remove('prompt-target','tapping');
 syncActor();
 return playing&&!demoCancelled;
}
async function waitForChat(){
 var end=Date.now()+7000;
 while((chatBusy||Date.now()<chatHoldUntil)&&Date.now()<end&&playing&&!demoCancelled)await nap(180);
}
// TOKYO_FOOD_67_MEAL_STORY_ANSWER_START
async function waitForStoryAnswer(){
 var end=Date.now()+30000,answer;
 while(Date.now()<end&&playing&&!demoCancelled){
  answer=document.querySelector('#msgs .turn:last-child .bub.ai');
  if(answer&&answer.textContent.indexOf('Vegan Izakaya Masaka')>=0&&$('tag').textContent==='4/4 · Format'&&!document.querySelector('#msgs .turn:last-child .typing-indicator')&&Date.now()>=chatHoldUntil)return answer;
  await nap(120);
 }
 throw new Error('The final Tokyo lunch answer did not finish before the restaurant scene.');
}
// TOKYO_FOOD_67_MEAL_STORY_ANSWER_END
async function pickThroughUI(g,key){
 var gate=document.querySelector('.gate[data-i="'+g+'"]');
 guidedGateTap=true;
 try{
  if(!await moveActorTo(gate))return false;
  // TOKYO_FOOD_68_EXPLAINER_ACTION_START
  if(g===1)await showProfAIExplanation();
  // TOKYO_FOOD_68_EXPLAINER_ACTION_END
  if(!await tapNode(gate))return false;
 }finally{guidedGateTap=false;}
 await nap(reduce?0:180);
 var input=optsEl.querySelector('input[data-k="'+key+'"]');
 if(!input)throw new Error('Prompt choice missing for gate '+g+': '+key);
 var option=input.closest('.opt');
 if(!await moveActorTo(option)||!await tapNode(option))return false;
 if(lastStep<g)goTo(g); // Task and Format can begin with a default in the source UI.
 await waitForChat();
 return playing&&!demoCancelled;
}
async function showPromptBeat(g){
 if(window.innerWidth>=900)return;
 if(g<4){
  await bringIntoView(document.querySelector('.stage'));
  parkActor();returnActor();
  var mapChat=document.querySelector('.chat');
  mapChat.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
  await nap(reduce?180:850);
 }
}
async function runPromptStory(){
 if(!guide){play();notifyStoryHost('failed');return;}
 demoCancelled=false;playing=true;paintPlay();
 try{
  var order=[{g:1,k:'guide'},{g:2,k:'lunch'},{g:3,k:'v'},{g:4,k:'list'}];
  for(var i=0;i<order.length;i++){
   if(!playing||demoCancelled)break;
   if(window.innerWidth<900){var stage=document.querySelector('.stage');stage.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});await nap(reduce?0:460);}
   wakeActor();
   if(!await pickThroughUI(order[i].g,order[i].k))break;
   await showPromptBeat(order[i].g);
  }
  if(playing&&!demoCancelled){
   await waitForChat();
   await waitForStoryAnswer();
   if(window.innerWidth<900){var chat=document.querySelector('.chat');chat.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});await nap(reduce?250:900);}
   // TOKYO_FOOD_67_MEAL_STORY_DWELL_START
   if(window.innerWidth<900){
    var chat=document.querySelector('.chat'),chatTop=chat.getBoundingClientRect().top;
    window.scrollTo({top:Math.max(0,window.scrollY+chatTop-64),behavior:reduce?'auto':'smooth'});
    await nap(reduce?0:700);
    var answer=document.querySelector('#msgs .turn:last-child .bub.ai');
    var messages=document.getElementById('msgs');
    if(answer&&messages){messages.scrollTo({top:messages.scrollHeight,behavior:reduce?'auto':'smooth'});await nap(reduce?0:700);}
    document.documentElement.dataset.storyAnswerPresented='true';
    await nap(reduce?0:2200);
   }
   // TOKYO_FOOD_67_MEAL_STORY_DWELL_END
   await playRestaurantPayoff();
   // TOKYO_FOOD_67_MEAL_STORY_HANDOFF_JS_START
   var handoff=document.getElementById('story-handoff');
   if(handoff&&!demoCancelled&&!acted){
    handoff.classList.add('on');handoff.setAttribute('aria-hidden','false');
    if(document.documentElement.dataset.promptStoryComplete==='true'){
     await nap(2000);
     if(!demoCancelled&&handoff.classList.contains('on'))notifyStoryHost('complete');
    }
   }
   // TOKYO_FOOD_67_MEAL_STORY_HANDOFF_JS_END
  }
 }catch(e){demoCancelled=true;console.error('[profai:first-lesson-story] story-failed',e);}
 var failed=demoCancelled;
 returnActor();playing=false;paintPlay();
 if(failed&&!acted)play();
 if(failed)notifyStoryHost('failed');
}
function startStory(){
 if(storyStarted)return;
 if(lesson){lesson.removeAttribute('inert');lesson.removeAttribute('aria-hidden');}
 if(document.hidden)return;
 storyStarted=true;runPromptStory();
}
function revealLesson(){
 if(curtainDone)return;
 curtainDone=true;
 setTimeout(function(){
  if(curtain&&curtain.isConnected){
   curtain.classList.add('leaving');
   setTimeout(function(){curtain.remove();startStory();},360);
  }else startStory();
 },8200);
}
if(curtain&&arrivalFrame){
 arrivalFrame.addEventListener('load',revealLesson,{once:true});
 if(window.__arrivalFrameLoaded)revealLesson();
 setTimeout(function(){if(!curtainDone){curtainDone=true;curtain.remove();startStory();}},10000);
}else setTimeout(startStory,900);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!storyStarted&&(!curtain||!curtain.isConnected))startStory();});
notifyStoryHost('ready');
})();
</script>
